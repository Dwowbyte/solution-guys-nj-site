<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request received — Solution Guys NJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D0A; --paper:#F3EFE1; --gold:#D9A82C; --route:#1F5C3B; --line:#CFC6AE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; padding:24px;
  }
  .card{
    max-width:520px; width:100%; border:2px solid var(--ink); background:var(--paper);
    padding:40px 32px; text-align:center; position:relative;
  }
  .card::before{ content:""; position:absolute; inset:6px; border:1px dashed var(--line); pointer-events:none; }
  .stamp{
    display:inline-block; border:3px solid var(--route); color:var(--route);
    font-family:'Oswald'; font-weight:700; font-size:14px; letter-spacing:0.08em;
    padding:6px 16px; transform:rotate(-4deg); margin-bottom:22px; text-transform:uppercase;
  }
  h1{ font-family:'Oswald'; font-weight:700; text-transform:uppercase; font-size:28px; margin:0 0 14px; letter-spacing:0.02em; }
  p{ font-size:15px; line-height:1.6; color:#3a3c36; margin:0 0 22px; }
  a.home-link{
    display:inline-block; font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--paper); background:var(--ink); padding:12px 22px; text-decoration:none;
  }
  a.home-link:hover{ background:var(--route); }
</style>
</head>
<body>
  <div class="card">
    <div class="stamp">Request Logged</div>
    <h1>Got it — we'll call you.</h1>
    <p>Your service request has been received. Someone from Solution Guys NJ will call or email you back with pricing and the next available date, usually within one business day. Need us sooner? Call <a href="tel:+16098456108"><strong>(609) 845-6108</strong></a>.</p>
    <a href="/" class="home-link">← Back to site</a>
  </div>
</body>
</html>
